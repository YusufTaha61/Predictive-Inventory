# Her push ve pull request'te testleri otomatik çalıştırır (CI).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Laravel (PHP) testleri
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: PHP kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite
          coverage: none

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: PHP paketlerini kur
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Arayüz dosyalarını derle
        run: |
          npm ci
          npm run build

      - name: .env hazırla
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Testleri çalıştır
        run: php artisan test

  # Python ML testleri
  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Python paketlerini kur
        run: pip install -r requirements.txt

      - name: Testleri çalıştır
        run: python -m unittest discover -s tests -t .
